name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHPUnit PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        os: [ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, json
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Vérification syntaxique PHP
        run: find src tests -name "*.php" | xargs php -l -n | grep -v "^No syntax errors" || true

      - name: Lancer les tests PHPUnit
        run: vendor/bin/phpunit --no-coverage
